name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  pack:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.pack.outputs.package }}
      integrity: ${{ steps.pack.outputs.integrity }}
      spec: ${{ steps.pack.outputs.spec }}
      dist-tag: ${{ steps.pack.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Package the release
        id: pack
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG must match package version v$version." >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          if [[ "$tag:$PRERELEASE" != "next:true" && "$tag:$PRERELEASE" != "latest:false" ]]; then
            echo 'GitHub prerelease setting must match the package version.' >&2
            exit 1
          fi
          npm pack --json > pack.json
          node --input-type=module - "$tag" <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync('pack.json', 'utf8'));
          console.log(`package=${pack.filename}`);
          console.log(`integrity=${pack.integrity}`);
          console.log(`spec=${pack.id}`);
          console.log(`dist-tag=${process.argv[2]}`);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.package }}
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/snow-letters
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
      - name: Publish verified tarball with trusted publishing
        env:
          PACKAGE_FILE: ${{ needs.pack.outputs.package }}
          PACKAGE_SPEC: ${{ needs.pack.outputs.spec }}
          PACKAGE_INTEGRITY: ${{ needs.pack.outputs.integrity }}
          DIST_TAG: ${{ needs.pack.outputs.dist-tag }}
        run: |
          actual="sha512-$(openssl dgst -sha512 -binary "$PACKAGE_FILE" | openssl base64 -A)"
          if [[ "$actual" != "$PACKAGE_INTEGRITY" ]]; then
            echo 'The downloaded artifact failed the integrity check.' >&2
            exit 1
          fi
          if published=$(npm view "$PACKAGE_SPEC" dist.integrity 2>registry-error); then
            if [[ -n "$published" ]]; then
              if [[ "$published" != "$PACKAGE_INTEGRITY" ]]; then
                echo "Registry already contains a different tarball for $PACKAGE_SPEC." >&2
                exit 1
              fi
              echo "$PACKAGE_SPEC is already published with matching integrity."
              exit 0
            fi
          elif ! grep -q 'code E404' registry-error; then
            cat registry-error >&2
            exit 1
          fi
          npm publish "./$PACKAGE_FILE" --tag "$DIST_TAG"
